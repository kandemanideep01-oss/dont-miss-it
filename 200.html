<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Anti-Cache Headers: Guarantees user browser always loads the latest code -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Don't Miss It — Global & Indian Travel Discovery (Advanced MVP)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase Official JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ========================================================
       7 DYNAMIC BACKGROUND THEMES (LIGHT & 6 DARK ATMOSPHERES)
       ======================================================== */
    :root, body.theme-light {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --secondary: #0f172a;
      --secondary-light: #334155;
      
      --gem-gold: #d97706;
      --gem-gold-light: #fef3c7;
      --gem-gold-border: #fcd34d;
      --gem-gold-btn: #d97706;
      
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.9);
      --bg: #f8fafc;
      --border: #e2e8f0;
      --border-focus: #0284c7;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      
      --shadow-subtle: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-card: 0 4px 16px rgba(15, 23, 42, 0.06);
      --shadow-hover: 0 16px 32px rgba(15, 23, 42, 0.12);
      --shadow-gem: 0 8px 24px rgba(217, 119, 6, 0.18);
      --theme-glow: 0 0 20px rgba(2, 132, 199, 0.2);
    }

    /* 2. Obsidian Midnight Theme (Deep Slate & Cyan) */
    body.theme-midnight, body.dark-mode {
      --bg: #0b1120;
      --surface: #151f32;
      --surface-glass: rgba(21, 31, 50, 0.88);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --primary-light: #0c4a6e;
      --secondary: #7dd3fc;
      --secondary-light: #94a3b8;
      --border: #23354d;
      --border-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.45);
      --shadow-hover: 0 16px 36px rgba(0, 0, 0, 0.65);
      --theme-glow: 0 0 24px rgba(56, 189, 248, 0.25);
    }

    /* 3. Cosmic Aurora Theme (Ultraviolet & Violet Space) */
    body.theme-cosmic {
      --bg: #080918;
      --surface: #12132b;
      --surface-glass: rgba(18, 19, 43, 0.88);
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --primary-light: #3b0764;
      --secondary: #c084fc;
      --secondary-light: #a5b4fc;
      --border: #2c2957;
      --border-focus: #c084fc;
      --text-main: #fbfbfe;
      --text-muted: #a5b4fc;
      --text-light: #6b7280;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.55);
      --shadow-hover: 0 16px 36px rgba(168, 85, 247, 0.3);
      --theme-glow: 0 0 26px rgba(168, 85, 247, 0.35);
    }

    /* 4. Golden Sunset Theme (Rajasthani Amber & Warm Peach) */
    body.theme-sunset {
      --bg: #140d07;
      --surface: #22160d;
      --surface-glass: rgba(34, 22, 13, 0.88);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --primary-light: #451a03;
      --secondary: #fbbf24;
      --secondary-light: #fde68a;
      --border: #422a18;
      --border-focus: #f59e0b;
      --text-main: #fffbeb;
      --text-muted: #fcd34d;
      --text-light: #92400e;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.55);
      --shadow-hover: 0 16px 36px rgba(245, 158, 11, 0.28);
      --theme-glow: 0 0 24px rgba(245, 158, 11, 0.35);
    }

    /* 5. Mystic Emerald Theme (Rainforest Jade & Mint) */
    body.theme-emerald {
      --bg: #04140d;
      --surface: #0a2418;
      --surface-glass: rgba(10, 36, 24, 0.88);
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #064e3b;
      --secondary: #34d399;
      --secondary-light: #a7f3d0;
      --border: #13422d;
      --border-focus: #10b981;
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --text-light: #047857;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.55);
      --shadow-hover: 0 16px 36px rgba(16, 185, 129, 0.28);
      --theme-glow: 0 0 24px rgba(16, 185, 129, 0.35);
    }

    /* 6. Oceanic Azure Theme (Mediterranean Abyss Navy & Cyan) */
    body.theme-oceanic {
      --bg: #031221;
      --surface: #092138;
      --surface-glass: rgba(9, 33, 56, 0.88);
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --primary-light: #082f49;
      --secondary: #38bdf8;
      --secondary-light: #bae6fd;
      --border: #133c5e;
      --border-focus: #0ea5e9;
      --text-main: #f0f9ff;
      --text-muted: #7dd3fc;
      --text-light: #0369a1;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.55);
      --shadow-hover: 0 16px 36px rgba(14, 165, 233, 0.28);
      --theme-glow: 0 0 24px rgba(14, 165, 233, 0.35);
    }

    /* 7. Cyberpunk Neon Theme (Tokyo Night Magenta & Neon Cyan) */
    body.theme-cyberpunk {
      --bg: #090614;
      --surface: #180f28;
      --surface-glass: rgba(24, 15, 40, 0.88);
      --primary: #ec4899;
      --primary-hover: #db2777;
      --primary-light: #701a75;
      --secondary: #06b6d4;
      --secondary-light: #f472b6;
      --border: #3c1e54;
      --border-focus: #ec4899;
      --text-main: #fdf2f8;
      --text-muted: #f472b6;
      --text-light: #831843;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.65);
      --shadow-hover: 0 16px 36px rgba(236, 72, 153, 0.35);
      --theme-glow: 0 0 28px rgba(236, 72, 153, 0.4);
    }

    /* 3D Interactive Canvas Layer */
    #bg-3d-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.5s ease;
    }

    #root {
      position: relative;
      z-index: 1;
    }

    /* 3D Card Tilt & Holographic Depth Styling */
    .place-box, .temple-mini-card, .highlights-hero-card, .itinerary-card, .destination-advisory-card, .prompt-studio-card {
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.15s ease-out, box-shadow 0.25s ease-out, border-color 0.25s ease;
      will-change: transform;
    }

    .place-box:hover, .temple-mini-card:hover, .highlights-hero-card:hover, .itinerary-card:hover {
      box-shadow: var(--shadow-hover), var(--theme-glow);
    }

    /* 3D Depth Pop on Inner Elements */
    .badge-rating, .badge-category, .badge-distance, .gem-arch-header {
      transform: translateZ(28px);
      transform-style: preserve-3d;
      transition: transform 0.2s ease;
    }

    .place-box-title, .temple-mini-title, .itinerary-card-head {
      transform: translateZ(16px);
    }

    /* Dynamic Glare Overlay */
    .card-glare-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      border-radius: inherit;
      z-index: 10;
      opacity: 0;
      mix-blend-mode: overlay;
      transition: opacity 0.25s ease;
    }

    /* Floating Theme Selector Widget */
    .floating-theme-fab {
      position: fixed;
      bottom: 82px;
      left: 24px;
      z-index: 990;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-fab-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-main);
      border: 2px solid var(--primary);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25), var(--theme-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }
    .theme-fab-btn:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35), var(--theme-glow);
    }

    .theme-quick-popover {
      position: absolute;
      bottom: 60px;
      left: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), var(--theme-glow);
      padding: 14px;
      width: 290px;
      animation: modalPopIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
      z-index: 1000;
      backdrop-filter: blur(14px);
    }

    .theme-quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .theme-quick-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .theme-quick-item:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .theme-quick-item.active {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .theme-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid rgba(255,255,255,0.4);
    }

    .nav-theme-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-theme-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    /* Appearance Settings 7-Theme Grid */
    .settings-theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .settings-theme-card {
      border-radius: 14px;
      border: 2px solid var(--border);
      padding: 12px;
      cursor: pointer;
      background: var(--bg);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .settings-theme-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .settings-theme-card.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary), 0 8px 20px rgba(0,0,0,0.2);
    }
    .theme-card-swatches {
      display: flex;
      gap: 4px;
      margin: 8px 0;
    }
    .theme-swatch-chip {
      height: 16px;
      flex: 1;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Top Page Loader Bar */
    .top-loader-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3.5px;
      background: linear-gradient(90deg, #38bdf8, #0284c7, #f59e0b, #10b981);
      background-size: 200% 100%;
      z-index: 9999;
      animation: pageLoadLine 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards, gradientShift 2s linear infinite;
    }
    @keyframes pageLoadLine {
      0% { width: 0%; opacity: 1; }
      70% { width: 85%; opacity: 1; }
      100% { width: 100%; opacity: 0; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatPin {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
    }

    @keyframes gemPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4);
        transform: translateX(-50%) scale(1);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(217, 119, 6, 0);
        transform: translateX(-50%) scale(1.05);
      }
    }

    @keyframes modalPopIn {
      0% { opacity: 0; transform: scale(0.88) translateY(30px); }
      60% { opacity: 1; transform: scale(1.02) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulseGlowBtn {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.5), 0 4px 15px rgba(2, 132, 199, 0.3);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(2, 132, 199, 0), 0 6px 20px rgba(2, 132, 199, 0.5);
      }
    }

    .anim-fade-up { animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .anim-delay-1 { animation-delay: 0.1s; }
    .anim-delay-2 { animation-delay: 0.2s; }
    .anim-delay-3 { animation-delay: 0.3s; }

    .app-wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .top-disclaimer {
      background: #fef3c7;
      color: #92400e;
      text-align: center;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #fde68a;
    }

    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 14px 22px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      z-index: 10000;
      animation: popToast 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popToast {
      from { transform: translateY(16px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Top Nav Header */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand-pin-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      animation: floatPin 3s ease-in-out infinite;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--secondary);
      letter-spacing: -0.4px;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: block;
    }
    .nav-links-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .nav-tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.25s ease;
    }
    .nav-tab-btn:hover { color: var(--primary); background: var(--primary-light); }
    .nav-tab-btn.active { color: var(--primary); background: var(--primary-light); }

    .theme-toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .theme-toggle-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .super-prompt-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      animation: pulseGlowBtn 3s infinite;
      transition: transform 0.2s ease;
    }
    .super-prompt-btn:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .floating-prompt-pill {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: #0f172a;
      color: #fff;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 999;
      transition: all 0.25s ease;
    }
    .floating-prompt-pill:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: #38bdf8;
      box-shadow: 0 14px 34px rgba(2, 132, 199, 0.4);
    }

    /* Hero Layout */
    .hero-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-bottom: 40px;
    }

    .plan-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-card);
    }
    .plan-card-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 6px;
    }
    .plan-card-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .dest-tabs-filter {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .filter-tab {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }
    .filter-tab.active {
      color: var(--primary);
      background: var(--primary-light);
    }

    .form-field-block { margin-bottom: 18px; }
    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 7px;
    }
    .field-select, .field-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-main);
      background-color: var(--surface);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .field-select:focus, .field-input:focus { border-color: var(--primary); }

    .duration-pills-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .duration-pill {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .duration-pill.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .budget-prefix-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .budget-prefix {
      position: absolute;
      left: 14px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .budget-prefix-wrap .field-input { padding-left: 32px; }

    .interests-chips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .interest-chip {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .interest-chip.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .plan-submit-btn {
      width: 100%;
      background: var(--secondary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      margin-top: 24px;
    }
    .plan-submit-btn:hover {
      background: #0284c7;
      transform: translateY(-2px);
    }

    /* Right Hero Card */
    .highlights-hero-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .highlights-hero-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }
    .highlights-hero-card:hover img { transform: scale(1.04); }
    .highlights-overlay {
      position: relative;
      background: linear-gradient(180deg, rgba(15,23,42,0) 0%, rgba(15,23,42,0.94) 100%);
      padding: 36px 32px 28px;
      color: #fff;
    }
    .highlight-top-badge {
      display: inline-block;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(8px);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .highlight-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .highlight-desc {
      font-size: 14px;
      color: #cbd5e1;
      max-width: 650px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .highlight-quick-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hl-dest-btn {
      background: rgba(255,255,255,0.92);
      border: none;
      color: #0f172a;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .hl-dest-btn:hover {
      background: #fff;
      transform: translateY(-2px);
    }

    /* ADVANCED FEATURE 4: Best Time to Visit Card */
    .destination-advisory-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin: 20px 0 28px;
      box-shadow: var(--shadow-subtle);
    }
    .advisory-col {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .adv-icon {
      font-size: 24px;
      line-height: 1;
      background: var(--primary-light);
      padding: 8px;
      border-radius: 10px;
    }
    .advisory-col strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .advisory-col p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ADVANCED FEATURE 3: Live Search & Tag Filter Toolbar */
    .search-filter-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0 0 28px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 250px;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }
    .search-input {
      width: 100%;
      padding: 10px 36px 10px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      outline: none;
      background: var(--surface);
      color: var(--text-main);
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
    }
    .tag-filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-filter-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-filter-btn:hover { border-color: var(--primary); color: var(--primary); }
    .tag-filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .sort-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .sort-select {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    /* Cards Grid */
    .section-header-block { margin-bottom: 22px; }
    .section-eyebrow {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: block;
      margin-bottom: 4px;
    }
    .section-main-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--secondary);
    }
    .section-desc { font-size: 14px; color: var(--text-muted); }

    .cards-row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
      margin-bottom: 48px;
    }

    .place-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .place-box:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }
    .place-box-media {
      position: relative;
      height: 180px;
      overflow: hidden;
    }
    .place-box-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .place-box:hover .place-box-media img { transform: scale(1.07); }

    .badge-rating {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }
    .badge-category {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-distance {
      position: absolute;
      bottom: 10px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .place-box-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .place-box-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 6px;
    }
    .place-box-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 12px;
      flex: 1;
    }
    .place-box-why {
      background: var(--bg);
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      font-size: 12.5px;
      color: var(--text-main);
      margin-bottom: 14px;
      border-radius: 0 6px 6px 0;
    }
    .place-box-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .place-card-btn {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--secondary);
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .place-card-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .place-card-btn.added {
      background: var(--success-light);
      border-color: var(--success);
      color: var(--success);
    }

    /* Hidden Gem Card Special Treatment */
    .place-box.gem-box {
      border: 1.5px solid var(--gem-gold-border);
      box-shadow: var(--shadow-gem);
    }
    .gem-arch-header {
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 18px;
      border-radius: 0 0 10px 10px;
      z-index: 10;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      animation: gemPulse 3s infinite;
    }

    /* Lower Split: Itinerary on Left, Summary Widget on Right */
    .lower-split {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 28px;
      align-items: start;
    }

    .itinerary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-card);
    }
    .itinerary-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .day-selector-pills { display: flex; gap: 8px; }
    .day-select-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .day-select-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .itinerary-action-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .itin-btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      color: var(--text-main);
      transition: all 0.2s;
    }
    .itin-btn:hover { background: var(--bg); }
    .btn-whatsapp-color {
      background: #25d366 !important;
      color: #fff !important;
      border-color: #25d366 !important;
    }
    .btn-whatsapp-color:hover { background: #1eb956 !important; }

    .timeline-chain { display: flex; flex-direction: column; gap: 14px; }
    .timeline-node {
      display: flex;
      gap: 16px;
      padding: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      align-items: flex-start;
      transition: all 0.2s;
    }
    .timeline-node.user-item {
      border-left: 4px solid var(--primary);
      background: var(--primary-light);
    }
    .timeline-node.is-done-slot {
      opacity: 0.6;
      border-left: 4px solid var(--success);
    }
    .timeline-hour-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 80px;
    }
    .timeline-hour {
      font-size: 12px;
      font-weight: 800;
      color: var(--secondary);
    }
    .slot-check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .slot-check-circle.checked {
      background: var(--success);
      border-color: var(--success);
    }
    .timeline-details { flex: 1; }
    .timeline-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .timeline-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--secondary);
    }
    .timeline-name.strikethrough {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .timeline-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.06);
    }
    .timeline-text {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Right Sticky Summary Widget */
    .summary-widget {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      position: sticky;
      top: 24px;
    }
    .widget-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 4px;
    }
    .widget-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }

    /* Transit Mode Selector */
    .transit-mode-wrap {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .transit-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .transit-chips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .transit-chip-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .transit-chip-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Group Expense Splitter */
    .group-splitter-wrap {
      margin-bottom: 16px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .group-splitter-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .group-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stepper-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-main);
    }
    .stepper-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .stepper-val { font-size: 15px; font-weight: 800; min-width: 18px; text-align: center; }

    .widget-bag-list {
      max-height: 140px;
      overflow-y: auto;
      margin-bottom: 14px;
      padding-right: 4px;
    }
    .bag-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dotted var(--border);
    }
    .bag-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .bag-price { font-weight: 700; color: var(--secondary); }

    .widget-breakdown {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 16px;
    }
    .cost-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .cost-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .total-cost-item {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 800;
      color: var(--secondary);
    }
    .total-cost-val { color: var(--primary); font-size: 18px; }

    .per-person-share-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary-light);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 8px;
    }

    .budget-target-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dotted var(--border);
    }
    .over-budget-warning {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 12px;
      color: #92400e;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .widget-btn-group { display: flex; gap: 8px; }
    .widget-action-btn {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--secondary);
      text-align: center;
      transition: all 0.2s ease;
    }
    .widget-action-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    /* Prompt Modal */
    .prompt-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: backdropFade 0.3s ease-out;
    }
    .prompt-modal-box {
      background: #0f172a;
      color: #f8fafc;
      width: 100%;
      max-width: 880px;
      max-height: 90vh;
      border-radius: 20px;
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 25px 60px -15px rgba(2, 132, 199, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalPopIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .prompt-modal-header {
      padding: 20px 26px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-sparkle-icon { font-size: 24px; }
    .modal-main-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .modal-sub-title {
      font-size: 12.5px;
      color: #94a3b8;
    }
    .modal-actions-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .copy-prompt-glow-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-prompt-glow-btn:hover { transform: scale(1.03); }
    .modal-close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #cbd5e1;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .modal-tabs-bar {
      display: flex;
      background: #0b1120;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 20px;
    }
    .modal-tab-item {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .modal-tab-item.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }
    .prompt-code-body {
      padding: 22px 26px;
      overflow-y: auto;
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.6;
      background: #080d16;
      color: #e2e8f0;
      white-space: pre-wrap;
    }
    .modal-footer {
      padding: 14px 26px;
      background: #090e17;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .prompt-stat-badge {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
    }

    /* Share Modal Styles */
    .share-link-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .share-link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .share-modal-box {
      background: var(--surface);
      color: var(--text-main);
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      padding: 28px;
      animation: modalPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .share-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .share-link-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .share-link-card:hover {
      border-color: var(--primary);
    }
    .share-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .share-type-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
    }
    .share-url-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .share-url-input {
      flex: 1;
      padding: 9px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-main);
    }
    .share-copy-btn {
      padding: 9px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .download-nav-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    .download-nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
    }
    .share-modal-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .share-tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .share-tab-btn.active {
      background: var(--surface);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .share-qr-card {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .share-qr-img {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      background: #fff;
      padding: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .download-card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .download-item-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s;
    }
    .download-item-card:hover {
      border-color: var(--primary);
    }
    .download-action-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .download-action-btn:hover {
      transform: translateY(-1px);
    }

    /* ==========================================================================
       AI AGENT COPILOT (ANTIGRAVITY STYLE AGENTIC ASSISTANT)
       ========================================================================== */
    .agent-floating-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31104b 100%);
      color: #fff;
      border: 1.5px solid #818cf8;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4), 0 0 20px rgba(129, 140, 248, 0.25);
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      z-index: 999;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: agentPulse 3s infinite ease-in-out;
    }
    .agent-floating-btn:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: #a5b4fc;
      box-shadow: 0 14px 40px rgba(99, 102, 241, 0.6), 0 0 30px rgba(165, 180, 252, 0.4);
    }
    @keyframes agentPulse {
      0%, 100% { box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35); }
      50% { box-shadow: 0 10px 35px rgba(129, 140, 248, 0.6), 0 0 25px rgba(99, 102, 241, 0.4); }
    }
    .agent-status-dot {
      width: 9px;
      height: 9px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
      animation: dotBlink 2s infinite ease;
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Top Nav Agent Button */
    .nav-agent-btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .nav-agent-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
    }

    /* Agent Drawer / Modal */
    .agent-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: flex-end;
      animation: backdropFade 0.25s ease-out;
    }
    .agent-drawer-panel {
      width: 100%;
      max-width: 530px;
      height: 100%;
      background: var(--surface);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 40px rgba(0,0,0,0.35);
      animation: drawerSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border-left: 1.5px solid var(--border);
    }
    @keyframes drawerSlideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .agent-header {
      padding: 18px 22px;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .agent-header-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .agent-avatar-icon {
      font-size: 24px;
      width: 44px;
      height: 44px;
      background: rgba(99, 102, 241, 0.25);
      border: 1.5px solid #818cf8;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
    .agent-engine-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #cbd5e1;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .agent-engine-selector:hover {
      background: rgba(255,255,255,0.14);
    }
    .agent-chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg);
    }
    .agent-msg-row {
      display: flex;
      flex-direction: column;
      max-width: 90%;
      animation: messageFadeIn 0.25s ease-out;
    }
    @keyframes messageFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .agent-msg-row.user {
      align-self: flex-end;
    }
    .agent-msg-row.agent {
      align-self: flex-start;
      max-width: 98%;
    }
    .agent-bubble-user {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      padding: 12px 16px;
      border-radius: 16px 16px 4px 16px;
      font-size: 13.5px;
      line-height: 1.5;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.25);
    }
    .agent-card-agent {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px 16px 16px 4px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    /* Thinking & Tools Log (Antigravity Style) */
    .agent-thought-block {
      background: rgba(99, 102, 241, 0.08);
      border-left: 3px solid #6366f1;
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .agent-thought-header {
      font-weight: 700;
      color: #6366f1;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .agent-tools-cluster {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .agent-tool-pill {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .agent-markdown-content {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-line;
    }
    .agent-markdown-content strong {
      color: var(--text-main);
      font-weight: 700;
    }

    /* In-App Action Card */
    .agent-action-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(6, 182, 212, 0.08));
      border: 1.5px solid #10b981;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .agent-apply-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    }
    .agent-apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.45);
    }

    /* Prompt Chips */
    .agent-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .agent-prompt-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }
    .agent-prompt-chip:hover {
      border-color: #6366f1;
      color: #6366f1;
      background: rgba(99, 102, 241, 0.08);
      transform: translateY(-1px);
    }

    /* Input Footer */
    .agent-footer {
      padding: 14px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .agent-input-field {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    .agent-input-field:focus {
      border-color: #6366f1;
      background: var(--surface);
    }
    .agent-send-btn {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .agent-send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .agent-thinking-pulse {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #6366f1;
      font-weight: 700;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
    .thinking-dots span {
      animation: thinkingBounce 1.4s infinite ease-in-out both;
    }
    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes thinkingBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* TEMPLE VISUAL DARSHAN SHOWCASE GALLERY */
    .temple-showcase-section {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(217, 119, 6, 0.03) 100%);
      border: 1.5px solid rgba(245, 158, 11, 0.35);
      border-radius: 20px;
      padding: 24px;
      margin-top: 36px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.08);
    }
    .temple-showcase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .temple-showcase-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .temple-showcase-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .temple-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }
    .temple-mini-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .temple-mini-card:hover {
      transform: translateY(-5px);
      border-color: #f59e0b;
      box-shadow: 0 14px 28px rgba(245, 158, 11, 0.25);
    }
    .temple-mini-card.active {
      border-color: #f59e0b;
      outline: 2px solid #f59e0b;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
    }
    .temple-mini-media {
      position: relative;
      height: 160px;
      overflow: hidden;
      background: #0f172a;
    }
    .temple-mini-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .temple-mini-card:hover .temple-mini-media img {
      transform: scale(1.08);
    }
    .temple-mini-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      color: #fef08a;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(254, 240, 138, 0.35);
      letter-spacing: 0.3px;
    }
    .temple-mini-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .temple-mini-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .temple-mini-region {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .temple-mini-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .temple-mini-btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-size: 12.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .temple-mini-btn:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: translateY(-1px);
    }

    .app-footer {
      border-top: 1px solid var(--border);
      margin-top: 60px;
      padding-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    @media (max-width: 992px) {
      .hero-split, .lower-split { grid-template-columns: 1fr; }
      .summary-widget { position: static; }
      .destination-advisory-card { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .cards-row-grid { grid-template-columns: 1fr; }
      .duration-pills-row, .interests-chips-grid { grid-template-columns: repeat(2, 1fr); }
      .top-nav { flex-direction: column; gap: 14px; align-items: flex-start; }
      .highlights-hero-card { min-height: 320px; }
      .floating-prompt-pill { bottom: 16px; left: 16px; padding: 10px 16px; font-size: 13px; }
    }

    /* ==========================================================================
       CINEMATIC 3D HYPERSPACE & HOLOGRAPHIC GYROSCOPIC OPENING LOGO
       ========================================================================== */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #0a0f1d 0%, #02040a 100%);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      perspective: 1200px;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s;
    }
    .splash-screen.splash-hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.08) rotateX(4deg);
      pointer-events: none;
    }

    /* 3D Hyperspace Warp & Globe Canvas */
    #splash-3d-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .splash-backdrop-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.42) 0%, rgba(168, 85, 247, 0.22) 40%, rgba(245, 158, 11, 0.12) 65%, transparent 80%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 2;
      animation: auraPulse3D 4s ease-in-out infinite alternate;
    }
    .splash-nebula-flare {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.8) 50%, transparent 100%);
      box-shadow: 0 0 25px #38bdf8;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 2;
      opacity: 0.65;
      animation: flareBeam 3s ease-in-out infinite alternate;
    }
    @keyframes auraPulse3D {
      0% { transform: scale(0.88); opacity: 0.55; }
      100% { transform: scale(1.25); opacity: 0.95; }
    }
    @keyframes flareBeam {
      0% { opacity: 0.3; transform: translateY(-50%) scaleX(0.7); }
      100% { opacity: 0.8; transform: translateY(-50%) scaleX(1.15); }
    }

    .splash-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 520px;
      z-index: 10;
      transform-style: preserve-3d;
      animation: cardPop3D 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardPop3D {
      0% { opacity: 0; transform: perspective(1000px) translateZ(-120px) rotateX(15deg); }
      100% { opacity: 1; transform: perspective(1000px) translateZ(0px) rotateX(0deg); }
    }

    /* 3D Gyroscopic Gimbal Stage */
    .splash-3d-stage {
      position: relative;
      width: 175px;
      height: 175px;
      margin-bottom: 24px;
      perspective: 1200px;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gimbal-ring {
      position: absolute;
      border-radius: 50%;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* Ring 1: Celestial Outer Ring (Golden Sunset) */
    .ring-celestial {
      width: 170px;
      height: 170px;
      border: 2px solid rgba(245, 158, 11, 0.75);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(245, 158, 11, 0.25);
      animation: spinCelestial 9s linear infinite;
    }
    .ring-marker {
      position: absolute;
      font-size: 10px;
      font-weight: 800;
      color: #fbbf24;
      text-shadow: 0 0 6px rgba(245, 158, 11, 0.8);
    }
    .marker-n { top: -14px; left: 50%; transform: translateX(-50%); }
    .marker-s { bottom: -14px; left: 50%; transform: translateX(-50%); }
    .marker-e { right: -14px; top: 50%; transform: translateY(-50%); }
    .marker-w { left: -14px; top: 50%; transform: translateY(-50%); }

    /* Ring 2: Meridian Middle Ring (Cyan/Azure) */
    .ring-meridian {
      width: 138px;
      height: 138px;
      border: 2px dashed rgba(56, 189, 248, 0.85);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      animation: spinMeridian 6.5s linear infinite reverse;
    }

    /* Ring 3: Polar Inner Ring (Ultraviolet Cosmic) */
    .ring-polar {
      width: 108px;
      height: 108px;
      border: 1.5px solid rgba(168, 85, 247, 0.8);
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.4);
      animation: spinPolar 5s linear infinite;
    }

    @keyframes spinCelestial {
      0% { transform: rotate3d(1, 0.6, 0.2, 0deg); }
      100% { transform: rotate3d(1, 0.6, 0.2, 360deg); }
    }
    @keyframes spinMeridian {
      0% { transform: rotate3d(0.2, 1, 0.7, 0deg); }
      100% { transform: rotate3d(0.2, 1, 0.7, 360deg); }
    }
    @keyframes spinPolar {
      0% { transform: rotate3d(0.8, 0.2, 1, 0deg); }
      100% { transform: rotate3d(0.8, 0.2, 1, 360deg); }
    }

    /* Center 3D Faceted Diamond Compass Core */
    .splash-core-gem {
      position: relative;
      width: 82px;
      height: 82px;
      background: radial-gradient(circle at 35% 35%, #0284c7 0%, #0369a1 45%, #082f49 100%);
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(36px);
      box-shadow: 0 16px 40px rgba(2, 132, 199, 0.6), 0 0 35px rgba(56, 189, 248, 0.6), inset 0 2px 6px rgba(255,255,255,0.7);
      animation: corePulse3D 3s ease-in-out infinite alternate;
      z-index: 10;
    }
    @keyframes corePulse3D {
      0% { transform: translateZ(32px) scale(0.96); }
      100% { transform: translateZ(42px) scale(1.06); }
    }

    .gem-compass-star {
      font-size: 44px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
      animation: compassOrient 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes compassOrient {
      0% { transform: rotate(-220deg) scale(0.4); opacity: 0; }
      55% { transform: rotate(400deg) scale(1.15); opacity: 1; }
      100% { transform: rotate(360deg) scale(1); opacity: 1; }
    }

    .gem-radar-sweep {
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      border: 1.5px solid transparent;
      border-top-color: #38bdf8;
      animation: radarSweep 2s linear infinite;
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Supersonic Jet 3D Orbit */
    .splash-jet-orbit {
      position: absolute;

      height: 210px;
      border-radius: 50%;

    .splash-jet-body {

    .jet-icon {

    .jet-sonic-trail {

      border-radius: 999px;
    }
    @keyframes jetOrbit3D {
      0% { transform: rotateX(68deg) rotateY(-25deg) rotateZ(0deg); }
      100% { transform: rotateX(68deg) rotateY(-25deg) rotateZ(360deg); }
    }

    /* Badge & Typography */
    .splash-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(56, 189, 248, 0.12);

    .badge-pulse-dot {

    @keyframes dotPulse {
      0% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .splash-brand-title {
      font-size: 38px;

      letter-spacing: -0.5px;

      text-shadow: 0 0 25px rgba(56, 189, 248, 0.6), 0 0 50px rgba(168, 85, 247, 0.4);

    }
    @keyframes titlePop3D {
      0% { opacity: 0; transform: translateY(20px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .splash-brand-motto {
      font-size: 14.5px;
      color: #cbd5e1;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 22px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      animation: titlePop3D 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    /* Telemetry & Loading Progress */
    .splash-loading-indicator {
      width: 100%;

      margin-bottom: 22px;

    .splash-loading-header {
      display: flex;

      margin-bottom: 8px;
    }
    #splash-percent-text {
      color: #38bdf8;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      background: rgba(56, 189, 248, 0.15);
      padding: 1px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .splash-loading-bar {
      width: 100%;

      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    .splash-loading-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6, #f59e0b);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      transition: width 2.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .splash-dest-ticker {
      font-size: 11px;
      color: #7dd3fc;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.85;
    }

    /* Launch 3D Button */
    .splash-launch-btn {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.9) 0%, rgba(3, 105, 161, 0.9) 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.6);
      color: #ffffff;
      padding: 11px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4), 0 0 15px rgba(56, 189, 248, 0.35);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: titlePop3D 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
    }
    .splash-launch-btn:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: #38bdf8;
      box-shadow: 0 10px 28px rgba(2, 132, 199, 0.6), 0 0 25px rgba(56, 189, 248, 0.55);
    }
    .splash-launch-btn:active {
      transform: translateY(1px) scale(0.98);
    }
    .launch-arrow {
      transition: transform 0.2s ease;
    }
    .splash-launch-btn:hover .launch-arrow {
      transform: translateX(4px);
    }

    /* Brand 3D Gyroscopic Navbar Emblem */
    .brand-3d-emblem {
      width: 44px;
      height: 44px;
      position: relative;
      perspective: 800px;
      transform-style: preserve-3d;
      background: radial-gradient(circle at 35% 35%, #0284c7 0%, #082f49 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4), inset 0 1px 2px rgba(255,255,255,0.4);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }
    .brand-3d-emblem:hover {
      transform: scale(1.12) rotateY(18deg);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.6), inset 0 1px 3px rgba(255,255,255,0.7);
    }
    .emblem-ring-outer {
      position: absolute;
      width: 36px;
      height: 36px;
      border: 1.5px solid rgba(56, 189, 248, 0.7);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin3DRing 4s linear infinite;
    }
    .emblem-ring-inner {
      position: absolute;
      width: 26px;
      height: 26px;
      border: 1.5px dashed rgba(245, 158, 11, 0.8);
      border-right-color: #38bdf8;
      border-radius: 50%;
      animation: spin3DRingRev 2.8s linear infinite;
    }
    .emblem-core {
      font-size: 20px;
      z-index: 2;
      animation: coreFloat 2.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    @keyframes spin3DRing {
      0% { transform: rotate3d(1, 1, 0, 0deg); }
      100% { transform: rotate3d(1, 1, 0, 360deg); }
    }
    @keyframes spin3DRingRev {
      0% { transform: rotate3d(0, 1, 1, 360deg); }
      100% { transform: rotate3d(0, 1, 1, 0deg); }
    }
    @keyframes coreFloat {
      0% { transform: scale(0.95) translateZ(4px); }
      100% { transform: scale(1.08) translateZ(10px); }
    }

    /* 3D Flip Wave Animation on Place Cards */
    @keyframes card3DFlipIn {
      0% {
        opacity: 0;
        transform: perspective(1000px) rotateY(-12deg) translateY(24px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: perspective(1000px) rotateY(0deg) translateY(0) scale(1);
      }
    }
    .anim-fade-up {
      animation: card3DFlipIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* 3D Metallic Diagonal Sheen on Hidden Gem Cards */
    .gem-box {
      overflow: hidden;
    }
    .gem-box::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background: linear-gradient(60deg, transparent 40%, rgba(245, 158, 11, 0.12) 50%, transparent 60%);
      transform: rotate(25deg);
      pointer-events: none;
      animation: gemSheenSweep 5s infinite;
      z-index: 5;
    }
    @keyframes gemSheenSweep {
      0%, 75% { transform: translateY(-100%) rotate(25deg); }
      100% { transform: translateY(100%) rotate(25deg); }
    }

    /* USER AUTHENTICATION & PROFILE STYLES */
    .nav-auth-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.3);
    }
    .nav-auth-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45);
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
    }

    .nav-user-badge-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 6px 14px 6px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-subtle);
    }
    .nav-user-badge-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
    }
    .user-nav-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;

      align-items: center;
      justify-content: center;
      font-size: 14px;

    .user-dropdown-card {

    .user-dropdown-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
    }
    .user-tier-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      background: #fef3c7;
      color: #92400e;
      padding: 2px 7px;
      border-radius: 999px;
      margin-top: 4px;
    }
    .user-dropdown-divider {
      height: 1px;
      background: var(--border);

    .user-dropdown-item {

    /* AUTH MODAL BOX */
    .auth-modal-box {

<body>
  <!-- High-Fidelity 3D Opening Cinema / Logo Intro -->
  <div id="opening-splash" class="splash-screen" onclick="dismissSplash()">
    <!-- 3D Hyperspace Warp & Wireframe Globe Canvas -->
    <canvas id="splash-3d-canvas"></canvas>

    <!-- Ambient Volumetric Lighting Glow -->
    <div class="splash-backdrop-glow"></div>
    <div class="splash-nebula-flare"></div>

    <div class="splash-card" onclick="event.stopPropagation()">
      <!-- Interactive 3D Gyroscopic Gimbal Core -->
      <div class="splash-3d-stage">
        <!-- 3D Orbiting Supersonic Jet with Light Beam -->
        <div class="splash-jet-orbit">
          <div class="splash-jet-body">
            <span class="jet-icon">✈️</span>
            <div class="jet-sonic-trail"></div>
          </div>
        </div>

        <!-- Ring 1: Celestial Gold Equator (Gimbal Outer) -->
        <div class="gimbal-ring ring-celestial">
          <div class="ring-marker marker-n">N</div>
          <div class="ring-marker marker-s">S</div>
          <div class="ring-marker marker-e">E</div>
          <div class="ring-marker marker-w">W</div>

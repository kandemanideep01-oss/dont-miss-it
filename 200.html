    function showSplash() {
      const splash = document.getElementById('opening-splash');
      if (splash) {
        splash.classList.remove('splash-hidden');
        if (typeof window.startSplash3D === 'function') {
          window.startSplash3D();
        }
        runSplashSequence();
      }
    }

    function runSplashSequence() {
      const telemetry = document.getElementById('splash-telemetry-text');
      const percent = document.getElementById('splash-percent-text');
      const prog = document.getElementById('splash-loading-progress');

      if (prog) {
        prog.style.width = '0%';
        prog.style.transition = 'width 2.2s cubic-bezier(0.16, 1, 0.3, 1)';
        requestAnimationFrame(() => { prog.style.width = '100%'; });
      }

      if (percent) {
        let p = 0;
        const interval = setInterval(() => {
          p = Math.min(100, p + Math.floor(Math.random() * 14 + 8));
          percent.textContent = p + '%';
          if (p >= 100) clearInterval(interval);
        }, 130);
      }

      setTimeout(() => { if (telemetry) telemetry.textContent = "Connecting 28 Destinations & 3D Spatial Maps..."; }, 600);
      setTimeout(() => { if (telemetry) telemetry.textContent = "Assembling Sacred Temples, Secret Gems & Epic Food..."; }, 1300);
      setTimeout(() => { if (telemetry) telemetry.textContent = "Spatial Travel Engine Ready • Welcome, Explorer! 🌍"; }, 2000);
      const isHold = new URLSearchParams(window.location.search).get('intro') === 'hold';
      if (!isHold) {
        setTimeout(dismissSplash, 2600);
      }
    }

    // 3D Hyperspace Warp & Wireframe Earth Globe Canvas Engine
    (function() {
      const canvas = document.getElementById('splash-3d-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height, cx, cy;
      let mouse = { x: 0, y: 0 };
      let animId = null;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        cx = width / 2;
        cy = height / 2;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', function(e) {
        mouse.x = (e.clientX - cx) / cx;
        mouse.y = (e.clientY - cy) / cy;
      }, { passive: true });

      const WARP_COUNT = 180;
      const warpStars = [];
      for (let i = 0; i < WARP_COUNT; i++) {
        warpStars.push({
          x: (Math.random() - 0.5) * 2200,
          y: (Math.random() - 0.5) * 1600,
          z: Math.random() * 1200 + 50,
          pz: 1200,
          speed: Math.random() * 12 + 8
        });
      }

      const GLOBE_RADIUS = 135;
      const FOCAL = 420;
      let globeRotY = 0;
      let globeRotX = 0.22;

      const BEACONS = [
        { lat: 30.73, lon: 79.06, name: "Kedarnath" },
        { lat: 51.50, lon: -0.12, name: "London" },
        { lat: 35.67, lon: 139.65, name: "Tokyo" },
        { lat: 48.85, lon: 2.35, name: "Paris" },
        { lat: 40.71, lon: -74.00, name: "New York" },
        { lat: 25.20, lon: 55.27, name: "Dubai" },
        { lat: 46.81, lon: 8.22, name: "Swiss Alps" },
        { lat: -33.86, lon: 151.20, name: "Sydney" },
        { lat: 13.75, lon: 100.50, name: "Bangkok" }
      ];

      const beaconPoints = BEACONS.map(b => {
        const phi = (90 - b.lat) * (Math.PI / 180);
        const theta = (b.lon + 180) * (Math.PI / 180);
        return {
          x: -(GLOBE_RADIUS * Math.sin(phi) * Math.cos(theta)),
          y: GLOBE_RADIUS * Math.cos(phi),
          z: GLOBE_RADIUS * Math.sin(phi) * Math.sin(theta),
          name: b.name
        };
      });

      function project3D(x, y, z, rotX, rotY, centerScreenX, centerScreenY) {
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        let x1 = x * cosY + z * sinY;
        let z1 = -x * sinY + z * cosY;

        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;

        const scale = FOCAL / (FOCAL + z2 + 350);
        return {
          px: centerScreenX + x1 * scale,
          py: centerScreenY + y2 * scale,
          scale: scale,
          z: z2
        };
      }

      function loop() {
        const splash = document.getElementById('opening-splash');
        if (!splash || splash.classList.contains('splash-hidden')) {
          animId = null;
          return;
        }

        ctx.clearRect(0, 0, width, height);

        // 1. Hyperspace Warp Stars
        for (let i = 0; i < warpStars.length; i++) {
          const s = warpStars[i];
          s.pz = s.z;
          s.z -= s.speed;
          if (s.z <= 10) {
            s.z = 1200;
            s.pz = 1200;
            s.x = (Math.random() - 0.5) * 2200;
            s.y = (Math.random() - 0.5) * 1600;
          }

          const k = FOCAL / s.z;
          const px = cx + (s.x + mouse.x * 60) * k;
          const py = cy + (s.y + mouse.y * 60) * k;

          const pk = FOCAL / s.pz;
          const prevX = cx + (s.x + mouse.x * 60) * pk;
          const prevY = cy + (s.y + mouse.y * 60) * pk;

          if (px >= 0 && px <= width && py >= 0 && py <= height) {
            const alpha = Math.min(1, (1200 - s.z) / 450);
            ctx.strokeStyle = `rgba(56, 189, 248, ${alpha * 0.75})`;
            ctx.lineWidth = Math.max(0.6, 2.4 * k);
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(px, py);
            ctx.stroke();

            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(px, py, Math.max(0.8, 1.8 * k), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 2. Rotating 3D Holographic Globe
        globeRotY += 0.012 + (mouse.x * 0.005);
        globeRotX = 0.22 + (mouse.y * 0.15);

        // Latitude rings
        ctx.lineWidth = 0.9;
        const LAT_STEPS = 6;
        for (let i = 1; i < LAT_STEPS; i++) {
          const latAngle = ((i / LAT_STEPS) - 0.5) * Math.PI;
          const r = GLOBE_RADIUS * Math.cos(latAngle);
          const y = GLOBE_RADIUS * Math.sin(latAngle);

          ctx.strokeStyle = 'rgba(56, 189, 248, 0.16)';
          ctx.beginPath();
          const CIRCLE_PTS = 32;
          for (let j = 0; j <= CIRCLE_PTS; j++) {
            const theta = (j / CIRCLE_PTS) * Math.PI * 2;
            const x = r * Math.cos(theta);
            const z = r * Math.sin(theta);
            const p = project3D(x, y, z, globeRotX, globeRotY, cx, cy - 65);
            if (j === 0) ctx.moveTo(p.px, p.py);
            else ctx.lineTo(p.px, p.py);
          }
          ctx.stroke();
        }

        // Longitude meridian rings
        const LON_STEPS = 8;
        for (let i = 0; i < LON_STEPS; i++) {
          const lonAngle = (i / LON_STEPS) * Math.PI;
          ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
          ctx.beginPath();
          const MERID_PTS = 32;
          for (let j = 0; j <= MERID_PTS; j++) {
            const phi = (j / MERID_PTS) * Math.PI * 2;
            const x = GLOBE_RADIUS * Math.sin(phi) * Math.cos(lonAngle);
            const y = GLOBE_RADIUS * Math.cos(phi);
            const z = GLOBE_RADIUS * Math.sin(phi) * Math.sin(lonAngle);
            const p = project3D(x, y, z, globeRotX, globeRotY, cx, cy - 65);
            if (j === 0) ctx.moveTo(p.px, p.py);
            else ctx.lineTo(p.px, p.py);
          }
          ctx.stroke();
        }

        // 3. Beacons & Flight Trajectories
        const projBeacons = beaconPoints.map(bp => {
          const p = project3D(bp.x, bp.y, bp.z, globeRotX, globeRotY, cx, cy - 65);
          return { ...p, name: bp.name };
        });

        ctx.lineWidth = 1.4;
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
        const flightPairs = [[0, 1], [1, 2], [3, 4], [5, 6], [7, 8]];
        for (let [idxA, idxB] of flightPairs) {
          const bA = projBeacons[idxA];
          const bB = projBeacons[idxB];
          if (bA.z < 60 || bB.z < 60) {
            ctx.beginPath();
            const midX = (bA.px + bB.px) / 2;
            const midY = ((bA.py + bB.py) / 2) - 28;
            ctx.moveTo(bA.px, bA.py);
            ctx.quadraticCurveTo(midX, midY, bB.px, bB.py);
            ctx.stroke();
          }
        }

        for (let p of projBeacons) {
          if (p.z < 80) {
            ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
            ctx.beginPath();
            ctx.arc(p.px, p.py, 6.5 * p.scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(p.px, p.py, 2.8 * p.scale, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        animId = requestAnimationFrame(loop);
      }

      window.startSplash3D = function() {
        if (!animId) {
          animId = requestAnimationFrame(loop);
        }
      };
      startSplash3D();
    })();

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', runSplashSequence);
    } else {
      runSplashSequence();
    }
    // Hard fallback timeout: Auto-dismiss after 3.2s maximum (unless intro=hold)
    if (new URLSearchParams(window.location.search).get('intro') !== 'hold') {
      setTimeout(dismissSplash, 3200);
    }
  </script>

    (function() {

    function runAgentReasoningEngine(query, currentDestName) {
      const q = query.toLowerCase().trim();
      
      // 1. Identify Target Destination
      let matchedDest = null;
      for (const key of Object.keys(AI_DESTINATION_INTELLIGENCE)) {
        if (q.includes(key.toLowerCase()) || 
           (key.includes("Kedarnath") && (q.includes("kedar") || q.includes("shiva"))) ||
           (key.includes("Badrinath") && (q.includes("badri") || q.includes("vishnu"))) ||
           (key.includes("Tirupati") && (q.includes("balaji") || q.includes("venkateswara") || q.includes("tirumala"))) ||
           (key.includes("Amritsar") && (q.includes("golden") || q.includes("harmandir"))) ||
           (key.includes("Madurai") && (q.includes("meenakshi") || q.includes("sundareswarar"))) ||
           (key.includes("Puri") && (q.includes("jagannath") || q.includes("puri"))) ||
           (key.includes("Rameswaram") && (q.includes("rameshwaram") || q.includes("dhanushkodi"))) ||
           (key.includes("Varanasi") && (q.includes("kashi") || q.includes("banaras") || q.includes("ganga"))) ||
           (key.includes("Vrindavan") && (q.includes("mathura") || q.includes("krishna") || q.includes("prem mandir"))) ||
           (key.includes("Somnath") && (q.includes("dwarka") || q.includes("somnath"))) ||
           (key.includes("Shirdi") && (q.includes("sai") || q.includes("shirdi")))) {
          matchedDest = key;
          break;
        }
      }
      if (!matchedDest) matchedDest = currentDestName || "Kedarnath";
      
      const intel = AI_DESTINATION_INTELLIGENCE[matchedDest] || AI_DESTINATION_INTELLIGENCE["Kedarnath"];
      
      // 2. Extract Duration & Budget
      let dur = intel.suggestedDuration;
      const dayMatch = q.match(/(\d+)\s*(day|days|d)/i);
      if (dayMatch) dur = Math.max(1, Math.min(10, parseInt(dayMatch[1])));
      
      let budg = intel.defaultBudget;
      const budgetMatch = q.match(/(?:rs\.?|₹|inr)?\s*(\d{3,6})/i);
      if (budgetMatch) budg = parseInt(budgetMatch[1]);
      
      // Transit detection
      let trMode = intel.suggestedTransit;
      if (q.includes("scooter") || q.includes("bike")) trMode = "scooter";
      else if (q.includes("cab") || q.includes("taxi")) trMode = "cab";
      else if (q.includes("metro") || q.includes("bus") || q.includes("public")) trMode = "transit";
      else if (q.includes("walk")) trMode = "walk";

      // Food Intent Detection
      const isFoodQuery = q.includes("food") || q.includes("eat") || q.includes("sweet") || 
                          q.includes("prasad") || q.includes("dish") || q.includes("restaurant") || 
                          q.includes("lunch") || q.includes("dinner") || q.includes("breakfast") || 
                          q.includes("flavour") || q.includes("taste") || q.includes("specialty");

      // Retrieve Destination Foods from dataset
      const destFoodsList = (GLOBAL_DESTINATIONS.find(d => 
        d.name.toLowerCase() === matchedDest.toLowerCase() || 
        d.id.toLowerCase() === matchedDest.toLowerCase() ||
        matchedDest.toLowerCase().includes(d.name.toLowerCase())
      ) || GLOBAL_DESTINATIONS[0]).localExperiences || [];

      // 3. Construct Chain-of-Thought (Antigravity Thinking)
      const thought = `1. Intent Analysis: Target destination resolved to [${matchedDest}] ${isFoodQuery ? '(Gastronomic & Famous Food Query detected)' : `(Duration: ${dur} days, Transit: ${trMode})`}.
2. Domain Intelligence: Loaded culinary heritage, deity attributes, temple kitchen lore, and sacred dining rules for ${matchedDest}.
3. Tool Execution:
   • inspect_destination("${matchedDest}"): Retrieved cultural context & key highlights.
   • search_famous_foods("${matchedDest}"): Loaded famous delicacies [${destFoodsList.map(f => f.name).join(", ")}].
   • check_darshan_protocols("${matchedDest}"): Loaded visitor schedules (${intel.darshan}) and guidelines.
   • calculate_budget(duration: ${dur}, transit: "${trMode}", targetBudget: ₹${budg}): Validated feasibility.
   • filter_hidden_gems("${matchedDest}"): Selected top sacred gems: [${intel.recommendedGems.join(", ")}].
4. Synthesis: Assembled tailored itinerary and authentic culinary recommendations with instant planner hook.`;

      // 4. Construct Tools Executed Array
      const tools = [
        { tool: "inspect_destination", input: matchedDest, result: intel.deity },
        { tool: "check_darshan_protocols", input: matchedDest, result: intel.rules.substring(0, 45) + "..." },
        { tool: "search_famous_foods", input: matchedDest, result: destFoodsList.map(f => f.name).join(" | ") },
        { tool: "calculate_transit_budget", input: `${dur} Days, ${trMode}`, result: `Feasible under ₹${budg}` },
        { tool: "filter_hidden_gems", input: matchedDest, result: intel.recommendedGems.join(", ") }
      ];

      // 5. Construct Markdown Reply
      const reply = `### 🌟 Antigravity Travel Plan: ${matchedDest}

**🕉️ Deity & Spiritual Context**: ${intel.deity}

#### ⏰ Sacred Darshan & Aarti Schedule
• ${intel.darshan}

#### 📋 Protocols & Dress Code Rules
• ${intel.rules}

#### 🗺️ Suggested ${dur}-Day Itinerary Strategy
• **Morning (Day 1)**: Early Darshan & Sacred Water Rituals (${trMode.toUpperCase()} transit).
• **Afternoon**: Explore Heritage Architecture & Local Sacred Markets.
• **Evening**: Experience Twilight Maha Aarti & Devotional Chanting.
${dur > 1 ? `• **Day 2–${dur}**: Excursions to secluded viewpoints and nearby sacred shrines.` : ''}

#### 💎 Can't-Miss Sacred Hidden Gems
${intel.recommendedGems.map(g => `• **${g}**`).join('\n')}

#### 🍲 Must-Taste Famous Foods & Prasadams
${destFoodsList.map(f => `• **${f.name}** (~₹${f.cost})\n  _${f.desc}_\n  📍 *${f.distance}*`).join('\n')}

#### 💡 Local Insider Hacks
• ${intel.secretTips}

#### 💰 Budget & Transit Optimization
• Recommended Mode: **${trMode.toUpperCase()}**
• Estimated Total: ~₹${Math.round(budg * 0.9)} (Well within your ₹${budg} budget target!)`;

      const actionPayload = {
        destination: matchedDest,
        duration: dur,
        transit: trMode,
        budget: budg,
        suggestedGems: intel.recommendedGems
      };

      return { thought, tools, reply, actionPayload };
    }

                tools: [{ tool: "gemini_generate_content", input: query, result: "200 OK" }],

              };
              setAgentMessages(prev => [...prev, agentMsg]);
              setIsAgentThinking(false);
              return;
            }
          } catch (err) {

          }
        }

            actionPayload: res.actionPayload

          if (destObj && destObj.hiddenGems) {

                      </div>
                      <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-muted)', lineHeight: '1.5' }}>
                        Connect your Supabase PostgreSQL cloud backend for persistent cross-device trip storage and real-time authentication.
                      </p>
                    </div>

                    {/* Pre-Linked Publishable Keys Selector */}
                    <div>
                      <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', marginBottom: '6px' }}>
                        Linked Supabase Publishable Key:
                      </label>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '8px' }}>
                        <button
                          type="button"
                          onClick={() => {
                            setSupabaseKey(SB_KEY_PRIMARY);
                            try { localStorage.setItem('dmi_supabase_key', SB_KEY_PRIMARY); } catch(e) {}
                            showToast("Primary Supabase Key selected! ⚡");
                          }}
                          style={{
                            padding: '10px',
                            borderRadius: '10px',
                            border: `1.5px solid ${supabaseKey === SB_KEY_PRIMARY ? '#10b981' : 'var(--border)'}`,
                            background: supabaseKey === SB_KEY_PRIMARY ? 'rgba(16, 185, 129, 0.12)' : 'var(--bg)',
                            color: 'var(--text)',
                            textAlign: 'left',
                            cursor: 'pointer'
                          }}
                        >
                          <div style={{ fontSize: '11px', fontWeight: '800', color: supabaseKey === SB_KEY_PRIMARY ? '#10b981' : 'var(--text)' }}>
                            {supabaseKey === SB_KEY_PRIMARY ? '✓ Key 1 (Primary Active)' : 'Key 1 (Primary)'}
                          </div>
                          <div style={{ fontSize: '10px', fontFamily: 'monospace', color: 'var(--text-muted)', marginTop: '2px', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                            sb_publishable_YRm4r...
                          </div>
                        </button>

                        <button
                          type="button"
                          onClick={() => {
                            setSupabaseKey(SB_KEY_SECONDARY);
                            try { localStorage.setItem('dmi_supabase_key', SB_KEY_SECONDARY); } catch(e) {}
                            showToast("Secondary Supabase Key selected! ⚡");
                          }}
                          style={{
                            padding: '10px',
                            borderRadius: '10px',
                            border: `1.5px solid ${supabaseKey === SB_KEY_SECONDARY ? '#10b981' : 'var(--border)'}`,
                            background: supabaseKey === SB_KEY_SECONDARY ? 'rgba(16, 185, 129, 0.12)' : 'var(--bg)',
                            color: 'var(--text)',
                            textAlign: 'left',
                            cursor: 'pointer'
                          }}
                        >
                          <div style={{ fontSize: '11px', fontWeight: '800', color: supabaseKey === SB_KEY_SECONDARY ? '#10b981' : 'var(--text)' }}>
                            {supabaseKey === SB_KEY_SECONDARY ? '✓ Key 2 (Active)' : 'Key 2 (Alternative)'}
                          </div>
                          <div style={{ fontSize: '10px', fontFamily: 'monospace', color: 'var(--text-muted)', marginTop: '2px', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                            sb_publishable_D1zlr...
                          </div>
                        </button>
                      </div>

                      <input
                        type="text"
                        className="share-url-input"
                        placeholder="sb_publishable_..."
                        value={supabaseKey}
                        onChange={(e) => {
                          const val = e.target.value.trim();
                          setSupabaseKey(val);
                          try { localStorage.setItem('dmi_supabase_key', val); } catch(e) {}
                        }}
                        style={{ width: '100%', boxSizing: 'border-box', fontSize: '11.5px', fontFamily: 'monospace' }}
                      />
                    </div>

                    {/* Supabase Project URL Input */}
                    <div>
                      <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', marginBottom: '6px' }}>
                        Supabase Project URL:
                      </label>
                      <input
                        type="url"
                        className="share-url-input"
                        placeholder="https://your-project-id.supabase.co"
                        value={supabaseUrl}
                        onChange={(e) => {
                          const val = e.target.value.trim();
                          setSupabaseUrl(val);
                          try { localStorage.setItem('dmi_supabase_url', val); } catch(e) {}
                        }}
                        style={{ width: '100%', boxSizing: 'border-box', fontSize: '12px' }}
                      />
                      <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '5px' }}>
                        📍 Find in your Supabase Dashboard: <strong>Project Settings ➔ API ➔ Project URL</strong>
                      </div>
                    </div>

                    {/* Connection Controls & Actions */}
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                      <button
                        type="button"
                        className="share-copy-btn"
                        style={{ flex: 1, padding: '10px 14px', background: '#10b981', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: '700', fontSize: '12px', cursor: 'pointer' }}
                        onClick={() => testSupabaseConnection(supabaseUrl, supabaseKey)}
                        disabled={supabaseStatus === 'checking'}
                      >
                        {supabaseStatus === 'checking' ? '⏳ Connecting...' : '⚡ Test Cloud Connection'}
                      </button>

                      <button
                        type="button"
                        className="share-copy-btn"
                        style={{ flex: 1, padding: '10px 14px', background: 'var(--primary)', color: '#fff', border: 'none', borderRadius: '8px', fontWeight: '700', fontSize: '12px', cursor: 'pointer' }}
                        onClick={syncTripsWithCloud}
                        disabled={isSyncingCloud}
                      >
                        {isSyncingCloud ? '⏳ Syncing Trips...' : '☁️ Sync Trips to Cloud'}
                      </button>
                    </div>

                    {/* Status Message */}
                    {supabaseStatusMsg && (
                      <div style={{ fontSize: '11.5px', padding: '8px 12px', borderRadius: '8px', background: supabaseStatus === 'connected' ? '#dcfce7' : '#fee2e2', color: supabaseStatus === 'connected' ? '#166534' : '#991b1b', fontWeight: '600' }}>
                        {supabaseStatusMsg}
                      </div>
                    )}

                    {/* Security Notice on Secret Key */}
                    <div style={{ padding: '10px 12px', borderRadius: '8px', background: 'var(--bg)', border: '1px dashed var(--border)', fontSize: '11px', color: 'var(--text-muted)', lineHeight: '1.45' }}>
                      🛡️ <strong>Security Architecture Note:</strong><br />
                      Your Supabase secret key (<code>sb_secret_••••••••</code>) is recognized as Supabase's master <code>service_role</code> key. In modern web architecture, frontend clients connect via the <strong>Publishable Key</strong> paired with Row Level Security (RLS) to ensure zero risk of unauthorized database tampering.
                    </div>
                  </div>
                )}

                <div style={{ marginTop: '18px', paddingTop: '14px', borderTop: '1px solid var(--border)', textAlign: 'right' }}>
                  <button
                    className="share-copy-btn"
                    onClick={() => {
                      setIsSettingsModalOpen(false);
                      showToast("Settings applied! ✓");
                    }}
                  >
                    ✓ Done
                  </button>
                </div>
              </div>
            </div>
          )}

{/* FLOATING QUICK THEME SWITCHER FAB */}
          <div className="floating-theme-fab">
            <button
              className="theme-fab-btn"
              onClick={() => setIsThemePaletteOpen(!isThemePaletteOpen)}
              title="Change Background Theme (7 Dynamic 3D Styles)"
            >
              <span>🎨</span>
            </button>
            {isThemePaletteOpen && (
              <div className="theme-quick-popover">
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '6px' }}>
                  <strong style={{ fontSize: '12.5px', color: 'var(--text-main)' }}>🎨 Choose Theme (7)</strong>
                  <button
                    onClick={() => setIsThemePaletteOpen(false)}
                    style={{ border: 'none', background: 'transparent', cursor: 'pointer', fontSize: '14px', color: 'var(--text-muted)' }}
                  >
                    ✕
                  </button>
                </div>
                <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '8px' }}>
                  Pick your preferred 3D atmosphere:
                </div>
                <div className="theme-quick-grid">
                  {THEMES.map(th => {
                    const isSelected = currentTheme === th.id;
                    return (
                      <div
                        key={th.id}
                        className={`theme-quick-item ${isSelected ? 'active' : ''}`}
                        onClick={() => {
                          setCurrentTheme(th.id);
                          showToast(`Theme changed to ${th.name}! ✨`);
                        }}
                      >
                        <span className="theme-dot" style={{ background: th.swatches[2] }}></span>
                        <span>{th.icon} {th.name.split(' ')[0]}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          <footer className="app-footer">
            <p>© {new Date().getFullYear()} Don't Miss It • "Don't just visit a destination. Discover everything around it."</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
